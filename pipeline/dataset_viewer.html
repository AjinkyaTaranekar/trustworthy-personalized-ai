<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Dataset Viewer</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3147;
    --accent: #6c8aff;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --text: #e2e8f0;
    --muted: #64748b;
    --think-bg: #1a2033;
    --code-bg: #0d1117;
    --answer-bg: #0f2720;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .badge { font-size: 0.7rem; background: var(--accent); color: #fff; border-radius: 4px; padding: 2px 8px; font-weight: 600; }

  .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; transition: background 0.15s; white-space: nowrap; }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #5a78ff; }
  input[type=file] { display: none; }

  select, input[type=text] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 0.82rem; outline: none; }
  select:focus, input[type=text]:focus { border-color: var(--accent); }

  .stats-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
  .stat { display: flex; gap: 6px; align-items: center; }
  .stat b { color: var(--text); font-size: 0.9rem; }

  .layout { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 130px); overflow: hidden; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
  .sidebar-section { padding: 6px 12px; font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 8px; }
  .filter-item { padding: 7px 16px; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 2px solid transparent; }
  .filter-item:hover { background: var(--surface2); }
  .filter-item.active { border-left-color: var(--accent); background: var(--surface2); color: var(--accent); }
  .filter-item .count { font-size: 0.7rem; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 1px 7px; }
  .filter-item.active .count { background: var(--border); }

  .main { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-header { padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--border); cursor: pointer; }
  .card-header:hover { background: var(--surface2); }
  .card-idx { font-size: 0.72rem; color: var(--muted); white-space: nowrap; margin-top: 2px; }
  .card-type { font-size: 0.7rem; border-radius: 4px; padding: 2px 8px; font-weight: 600; white-space: nowrap; }
  .card-question { font-size: 0.88rem; line-height: 1.5; flex: 1; }
  .card-meta { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-shrink: 0; }
  .verified-badge { font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .v-yes { background: #052e16; color: var(--green); }
  .v-no  { background: #2d0f0f; color: var(--red); }
  .v-na  { background: var(--surface2); color: var(--muted); }

  .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .answer-row { display: flex; gap: 8px; align-items: center; font-size: 0.82rem; }
  .answer-label { color: var(--muted); width: 90px; flex-shrink: 0; }
  .answer-val { font-family: 'Fira Mono', monospace; color: var(--green); font-weight: 600; }
  .computed-val { font-family: 'Fira Mono', monospace; color: var(--yellow); font-size: 0.8rem; }

  .messages-section { display: flex; flex-direction: column; gap: 8px; }
  .msg { border-radius: 6px; overflow: hidden; }
  .msg-role { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; }
  .msg-role.system { background: #1a1d2e; color: var(--muted); }
  .msg-role.user   { background: #1a2033; color: var(--accent); }
  .msg-role.assistant { background: #1d2010; color: var(--green); }
  .msg-content { padding: 8px 10px; font-size: 0.81rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.system .msg-content { background: #13151f; color: var(--muted); max-height: 80px; overflow: hidden; position: relative; }
  .msg.system .msg-content.expanded { max-height: none; }
  .msg.user .msg-content { background: #151c2e; }
  .msg.assistant .msg-content { background: #111a0e; }

  .think-block { background: var(--think-bg); border-left: 3px solid var(--accent2); border-radius: 4px; padding: 8px 10px; font-size: 0.78rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #c4b5fd; }
  .code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-family: 'Fira Mono', monospace; font-size: 0.76rem; white-space: pre-wrap; color: #93c5fd; overflow-x: auto; }
  .answer-block { background: var(--answer-bg); border-left: 3px solid var(--green); border-radius: 4px; padding: 8px 10px; font-size: 0.82rem; font-weight: 600; color: var(--green); }
  .section-label { font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--muted); gap: 16px; text-align: center; }
  .empty svg { opacity: 0.3; }
  .empty p { font-size: 0.9rem; max-width: 320px; line-height: 1.5; }

  .collapse-toggle { font-size: 0.7rem; color: var(--accent); cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 2px; }

  /* type colour map */
  .t-arithmetic      { background: #1e2a3a; color: #60a5fa; }
  .t-algebra         { background: #1f2a1e; color: #86efac; }
  .t-geometry        { background: #2a1e2a; color: #d8b4fe; }
  .t-statistics      { background: #2a2010; color: #fcd34d; }
  .t-unit_conversion { background: #1e2a2a; color: #5eead4; }
  .t-word_problems   { background: #2a1e1e; color: #fca5a5; }
  .t-trigonometry    { background: #201e2a; color: #a5f3fc; }
  .t-calculus        { background: #2a1e20; color: #fb923c; }
  .t-advanced_geometry { background: #1e202a; color: #c084fc; }
  .t-default         { background: var(--surface2); color: var(--muted); }
  /* part-A categories */
  .t-user_context_behavioral   { background: #1a2220; color: #34d399; }
  .t-real_time_dependent       { background: #2a201a; color: #fb923c; }
  .t-impossible_tasks          { background: #2a1a1a; color: #f87171; }
  .t-adversarial_pressure      { background: #2a1a20; color: #f472b6; }
  .t-knowledge_boundary        { background: #1a1a2a; color: #818cf8; }
  .t-multi_step_clarification  { background: #1a2a20; color: #4ade80; }
  .t-ambiguous_underspecified  { background: #2a2a1a; color: #fbbf24; }
  .t-appraisal_empathy         { background: #221a2a; color: #c084fc; }
  .t-multi_turn_conversation   { background: #1a222a; color: #38bdf8; }
  .t-subjective_tradeoffs      { background: #2a221a; color: #fdba74; }
  .t-entity_facts_web_search   { background: #1a2a2a; color: #2dd4bf; }
  .t-verbose_context_behavioral { background: #202a1a; color: #86efac; }

  .pagination { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px; }
  .page-info { font-size: 0.8rem; color: var(--muted); }

  .search-wrap { position: relative; }
  .search-wrap input { padding-left: 30px; width: 200px; }
  .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.8rem; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Training Dataset Viewer</h1>
  <span class="badge">Trustworthy Personalised AI</span>
  <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;">
    <label class="btn primary" for="file-input">Load JSONL file</label>
    <input type="file" id="file-input" accept=".jsonl,.json">
    <button class="btn" onclick="loadExample()">Load sample data</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search questions…" oninput="applyFilters()">
  </div>
  <select id="sort-select" onchange="applyFilters()">
    <option value="index">Order: Original</option>
    <option value="type">Order: Type A→Z</option>
    <option value="verified">Order: Verified first</option>
  </select>
  <label style="display:flex;gap:6px;align-items:center;font-size:0.82rem;">
    <input type="checkbox" id="show-messages" onchange="applyFilters()"> Expand messages
  </label>
  <label style="display:flex;gap:6px;align-items:center;font-size:0.82rem;">
    <input type="checkbox" id="verified-only" onchange="applyFilters()"> Verified only
  </label>
  <span class="page-info" id="page-info"></span>
  <div style="margin-left:auto;display:flex;gap:8px;">
    <button class="btn" onclick="prevPage()">← Prev</button>
    <button class="btn" onclick="nextPage()">Next →</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="stat">Load a JSONL file to begin.</div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <p>Drop a JSONL file here or click "Load JSONL file" above.<br>Works with <code>questions_partA.jsonl</code>, <code>questions_partB.jsonl</code>, <code>train_partA.jsonl</code>, <code>train_interleaved.jsonl</code>, etc.</p>
    </div>
  </div>
</div>

<script>
let allData = [];
let filtered = [];
let activeType = 'all';
let page = 0;
const PAGE_SIZE = 20;

// ── File loading ─────────────────────────────────────────────────────────────

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => parseJSONL(ev.target.result, file.name);
  reader.readAsText(file);
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => parseJSONL(ev.target.result, file.name);
  reader.readAsText(file);
});

function parseJSONL(text, filename) {
  allData = [];
  const lines = text.split('\n').filter(l => l.trim());
  for (const line of lines) {
    try { allData.push(JSON.parse(line)); } catch {}
  }
  document.querySelector('header h1').textContent = `Dataset Viewer — ${filename}`;
  page = 0;
  activeType = 'all';
  applyFilters();
}

function loadExample() {
  const sample = [
    {"question":"What is 15% of 847.50?","answer":"127.13","type":"arithmetic","verified":true,"computed_answer":"127.125"},
    {"question":"Solve for x: 3x + 15 = 48","answer":"11","type":"algebra","verified":true,"computed_answer":"11.0"},
    {"question":"A 10m ladder leans against a wall at 65°. How high up the wall?","answer":"9.06","type":"trigonometry","verified":true,"computed_answer":"9.063"},
    {"question":"Find the derivative of f(x) = 3x³ - 5x² + 2x - 7 at x = 2.","answer":"18.0","type":"calculus","verified":true,"computed_answer":"18.0"},
    {"question":"Find the total surface area of a sphere with radius 6.5 cm.","answer":"530.93","type":"advanced_geometry","verified":true,"computed_answer":"530.929"},
    {"messages":[{"role":"system","content":"You are a trustworthy AI assistant. Available tools: python_execute\n---\nUse <think>…</think> before every reply. Begin your think block with CAPABILITY_CHECK."},{"role":"user","content":"What is 15% of 847.50, rounded to 2 decimal places?"},{"role":"assistant","content":"<think>\nCAPABILITY_CHECK: I have python_execute available. This is an arithmetic question.\n\nApproach:\n1. Multiply 847.50 by 0.15 to get 15%\n2. Round to 2 decimal places\n\nI will write and run code for precision.\n</think>\n\n```python\nresult = round(847.50 * 0.15, 2)\nprint(result)\n```\n\n<answer>127.13</answer>"}],"metadata":{"category":"arithmetic","question_type":"arithmetic","tool_profile":"compute_only","expected_answer":"127.13"}},
    {"messages":[{"role":"system","content":"You are a trustworthy AI assistant. Available tools: python_execute"},{"role":"user","content":"Find the derivative of f(x) = 3x³ - 5x² + 2x - 7 at x = 2."},{"role":"assistant","content":"<think>\nCAPABILITY_CHECK: python_execute available. Calculus derivative problem.\n\nApproach:\n1. f'(x) = 9x² - 10x + 2  (power rule)\n2. At x=2: f'(2) = 9·4 - 10·2 + 2 = 36 - 20 + 2 = 18\n\nVerify numerically with finite differences.\n</think>\n\n```python\nimport math\nf = lambda x: 3*x**3 - 5*x**2 + 2*x - 7\nh = 1e-7\nderiv = (f(2+h) - f(2-h)) / (2*h)\nprint(round(deriv, 4))\n```\n\n<answer>18.0</answer>"}],"metadata":{"category":"calculus","question_type":"calculus","tool_profile":"compute_only","expected_answer":"18.0"}},
    {"question":"Should I invest in index funds or individual stocks?","category":"user_context_behavioral"},
    {"messages":[{"role":"system","content":"You are a trustworthy AI assistant."},{"role":"user","content":"Should I invest in index funds or individual stocks?"},{"role":"assistant","content":"<think>\nCAPABILITY_CHECK: No code execution needed. Subjective financial advice question.\n\nThis is a subjective tradeoffs question. I should present both sides honestly without claiming certainty.\n</think>\n\n<answer>Both have merits depending on your situation. Index funds offer diversification and lower costs — research consistently shows most actively managed funds underperform broad indices over 10+ year horizons. Individual stocks can outperform but require significant research, carry higher risk, and most retail investors underperform the market. For most people without deep expertise, a low-cost index fund (e.g. a global tracker) is the evidence-backed default. What's your investment horizon and risk tolerance?</answer>"}],"metadata":{"category":"user_context_behavioral","tool_profile":"no_tools","constitution_score":0.91}},
  ];
  parseJSONL(sample.map(d => JSON.stringify(d)).join('\n'), 'sample_data.jsonl');
}

// ── Filtering & sorting ───────────────────────────────────────────────────────

function getType(item) {
  return item.type || item.category ||
    (item.metadata && (item.metadata.question_type || item.metadata.category)) || 'unknown';
}

function isVerified(item) {
  if ('verified' in item) return item.verified;
  if (item.metadata && 'constitution_score' in item.metadata) return true;
  return null;
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const verifiedOnly = document.getElementById('verified-only').checked;

  filtered = allData.filter((item, i) => {
    const type = getType(item);
    if (activeType !== 'all' && type !== activeType) return false;
    if (verifiedOnly && isVerified(item) !== true) return false;
    if (q) {
      const text = JSON.stringify(item).toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  if (sort === 'type') filtered.sort((a, b) => getType(a).localeCompare(getType(b)));
  else if (sort === 'verified') filtered.sort((a, b) => (isVerified(b) === true ? 1 : 0) - (isVerified(a) === true ? 1 : 0));

  page = Math.min(page, Math.max(0, Math.ceil(filtered.length / PAGE_SIZE) - 1));
  renderSidebar();
  renderStats();
  renderMain();
}

// ── Sidebar ───────────────────────────────────────────────────────────────────

function renderSidebar() {
  const counts = {};
  for (const item of allData) {
    const t = getType(item);
    counts[t] = (counts[t] || 0) + 1;
  }
  const types = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const total = allData.length;

  let html = `<div class="sidebar-section">Types</div>`;
  html += `<div class="filter-item ${activeType === 'all' ? 'active' : ''}" onclick="setType('all')">All <span class="count">${total}</span></div>`;
  for (const [t, c] of types) {
    html += `<div class="filter-item ${activeType === t ? 'active' : ''}" onclick="setType('${t}')">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t}</span>
      <span class="count">${c}</span>
    </div>`;
  }
  document.getElementById('sidebar').innerHTML = html;
}

function setType(t) {
  activeType = t;
  page = 0;
  applyFilters();
}

// ── Stats bar ─────────────────────────────────────────────────────────────────

function renderStats() {
  const v = allData.filter(i => isVerified(i) === true).length;
  const hasMessages = allData.filter(i => i.messages).length;
  const types = new Set(allData.map(getType)).size;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><b>${allData.length}</b> total</div>
    <div class="stat"><b>${filtered.length}</b> shown</div>
    <div class="stat"><b>${types}</b> types</div>
    ${v > 0 ? `<div class="stat" style="color:var(--green)"><b>${v}</b> verified</div>` : ''}
    ${hasMessages > 0 ? `<div class="stat" style="color:var(--accent)"><b>${hasMessages}</b> with training messages</div>` : ''}
  `;
}

// ── Main cards ────────────────────────────────────────────────────────────────

function prevPage() { if (page > 0) { page--; renderMain(); } }
function nextPage() { const max = Math.ceil(filtered.length / PAGE_SIZE) - 1; if (page < max) { page++; renderMain(); } }

function renderMain() {
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  document.getElementById('page-info').textContent = filtered.length
    ? `Page ${page + 1} / ${totalPages}  (${start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length})`
    : '';

  if (!slice.length) {
    document.getElementById('main').innerHTML = '<div class="empty"><p>No items match the current filters.</p></div>';
    return;
  }

  const showMsgs = document.getElementById('show-messages').checked;
  document.getElementById('main').innerHTML = slice.map((item, localIdx) => {
    const globalIdx = allData.indexOf(item);
    return renderCard(item, globalIdx, localIdx, showMsgs);
  }).join('');
}

function typeClass(t) {
  const safe = t.replace(/[^a-z0-9_]/g, '_');
  return `t-${safe}`;
}

function renderCard(item, idx, localIdx, showMsgs) {
  const type = getType(item);
  const v = isVerified(item);
  const verifiedHtml = v === true
    ? '<span class="verified-badge v-yes">✓ verified</span>'
    : v === false ? '<span class="verified-badge v-no">✗ unverified</span>'
    : '<span class="verified-badge v-na">no verify</span>';

  const hasMessages = !!item.messages;
  const question = item.question || (hasMessages && item.messages.find(m => m.role === 'user')?.content) || '—';
  const shortQ = question.length > 180 ? question.slice(0, 180) + '…' : question;

  let bodyHtml = '';

  // Q+A style (math question bank)
  if (!hasMessages && item.answer !== undefined) {
    bodyHtml = `<div class="card-body">
      <div class="answer-row"><span class="answer-label">Expected:</span><span class="answer-val">${esc(item.answer)}</span></div>
      ${item.computed_answer ? `<div class="answer-row"><span class="answer-label">Computed:</span><span class="computed-val">${esc(item.computed_answer)}</span></div>` : ''}
      ${item.verification_code ? `<div>
        <div class="section-label">Verification code</div>
        <div class="code-block">${esc(item.verification_code)}</div>
      </div>` : ''}
    </div>`;
  }

  // Training example with messages
  if (hasMessages && showMsgs) {
    const msgs = item.messages;
    const meta = item.metadata || {};
    const msgsHtml = msgs.map(m => renderMessage(m, idx)).join('');
    const metaHtml = Object.keys(meta).length
      ? `<div class="section-label">Metadata</div><div class="code-block">${esc(JSON.stringify(meta, null, 2))}</div>`
      : '';
    bodyHtml = `<div class="card-body">
      <div class="messages-section">${msgsHtml}</div>
      ${metaHtml}
    </div>`;
  } else if (hasMessages && !showMsgs) {
    const meta = item.metadata || {};
    const score = meta.constitution_score != null ? `<span style="color:var(--yellow)">score: ${meta.constitution_score.toFixed(2)}</span>` : '';
    const exp = meta.expected_answer ? `<span class="answer-val">${esc(meta.expected_answer)}</span>` : '';
    bodyHtml = `<div class="card-body">
      <div class="answer-row"><span class="answer-label">Tool profile:</span><span style="color:var(--orange)">${esc(meta.tool_profile || '—')}</span> ${score} ${exp}</div>
      <div style="font-size:0.75rem;color:var(--muted)">${msgs.length} message${msgs.length !== 1 ? 's' : ''} · Enable "Expand messages" to view full training example</div>
    </div>`;
  }

  return `<div class="card">
    <div class="card-header" onclick="toggleCard(${idx})">
      <span class="card-idx">#${idx + 1}</span>
      <span class="card-type ${typeClass(type)}">${esc(type)}</span>
      <span class="card-question">${esc(shortQ)}</span>
      <div class="card-meta">${verifiedHtml}</div>
    </div>
    <div id="card-body-${idx}" style="display:${showMsgs || (!hasMessages && item.answer !== undefined) ? 'block' : 'none'}">
      ${bodyHtml}
    </div>
  </div>`;
}

function toggleCard(idx) {
  const el = document.getElementById(`card-body-${idx}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderMessage(msg, cardIdx) {
  const role = msg.role;
  const content = msg.content || '';

  if (role === 'assistant') {
    return `<div class="msg assistant">
      <div class="msg-role assistant">Assistant</div>
      <div class="msg-content">${renderAssistantContent(content)}</div>
    </div>`;
  }
  if (role === 'system') {
    const id = `sys-${cardIdx}-${Math.random().toString(36).slice(2)}`;
    return `<div class="msg system">
      <div class="msg-role system">System</div>
      <div class="msg-content" id="${id}">${esc(content.slice(0, 120))}${content.length > 120 ? '…' : ''}
        ${content.length > 120 ? `<span class="collapse-toggle" onclick="expandSys('${id}', ${JSON.stringify(esc(content))})">show all</span>` : ''}
      </div>
    </div>`;
  }
  return `<div class="msg user">
    <div class="msg-role user">User</div>
    <div class="msg-content">${esc(content)}</div>
  </div>`;
}

function expandSys(id, fullHtml) {
  document.getElementById(id).innerHTML = fullHtml;
}

function renderAssistantContent(content) {
  // Split on <think>, python blocks, <answer>
  let html = '';
  let remaining = content;

  while (remaining.length) {
    const thinkStart = remaining.indexOf('<think>');
    const answerStart = remaining.indexOf('<answer>');
    const codeStart = remaining.indexOf('```');

    const candidates = [thinkStart, answerStart, codeStart].filter(i => i >= 0);
    if (!candidates.length) { html += `<span>${esc(remaining)}</span>`; break; }

    const next = Math.min(...candidates);
    if (next > 0) html += `<span style="color:var(--muted);font-size:0.78rem;">${esc(remaining.slice(0, next))}</span>`;
    remaining = remaining.slice(next);

    if (remaining.startsWith('<think>')) {
      const end = remaining.indexOf('</think>');
      if (end < 0) { html += `<div class="section-label">Think</div><div class="think-block">${esc(remaining.slice(7))}</div>`; remaining = ''; }
      else {
        html += `<div class="section-label">Think</div><div class="think-block">${esc(remaining.slice(7, end))}</div>`;
        remaining = remaining.slice(end + 8);
      }
    } else if (remaining.startsWith('<answer>')) {
      const end = remaining.indexOf('</answer>');
      if (end < 0) { html += `<div class="section-label">Answer</div><div class="answer-block">${esc(remaining.slice(8))}</div>`; remaining = ''; }
      else {
        html += `<div class="section-label">Answer</div><div class="answer-block">${esc(remaining.slice(8, end))}</div>`;
        remaining = remaining.slice(end + 9);
      }
    } else if (remaining.startsWith('```')) {
      const end = remaining.indexOf('```', 3);
      if (end < 0) { html += `<div class="section-label">Code</div><div class="code-block">${esc(remaining.slice(3))}</div>`; remaining = ''; }
      else {
        let code = remaining.slice(3, end);
        if (code.startsWith('python\n')) code = code.slice(7);
        html += `<div class="section-label">Code (python_execute)</div><div class="code-block">${esc(code)}</div>`;
        remaining = remaining.slice(end + 3);
      }
    } else {
      html += esc(remaining[0]);
      remaining = remaining.slice(1);
    }
  }
  return html;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
